### AUTOSTART ###

env = PATH,$HOME/.cargo/bin:$PATH

exec-once = xset r rate 190 50
exec-once = hyprctl setcursor $cursor_theme $cursor_size
exec-once = systemctl --user start --no-block thunar.service
exec-once = hyprsunset
exec-once = hypridle
exec-once = hyprlogd snitch
exec-once = timeline-hyprfocusd-snitch
# exec-once = alga power on
exec-once = ~/.home-manager/scripts/battery-monitor.sh
exec-once = kdeconnectd
exec-once = ambxst
exec-once = ~/.home-manager/config_files/swww/ambxst_wallpaper_timer.sh
exec-once = ~/.home-manager/config_files/hypr/scripts/open_chromium.sh
exec-once = betterbird
exec-once = handy --start-hidden
