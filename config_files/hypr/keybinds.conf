source = $HOME/.config/hypr/variables.conf
source = $HOME/.config/hypr/platform-variables.conf

### KEYBINDINGS ###

bindd = SUPER, SPACE, App Launcher, exec, wofi -S drun # app launcher
bindd = SUPER ALT, SPACE, Remote App Launcher, exec, ~/.home-manager/scripts/waypipe-launcher.sh 
bindd = SUPER, Q, Launch Terminal, exec, $terminal # new terminal
bindd = SUPER, B, Launch Browser, exec, $browser # new browser
bindd = ALT, F4, Close Program, killactive
bindd = SUPER, F11, Fullscreen, fullscreen
# bind = SUPER, G, exec, gimp -n
bindd = SUPER, F, Launch File Manager, exec, $fileManager
bindd = SUPER, V, Toogle Floating, togglefloating
# bind = SUPER SHIFT, R, exec, pkill hyprpaper; hyprctl reload; hyprpaper &
bindd = SUPER SHIFT, R, Next Wallpaper, exec, kill -USR1 $(cat /tmp/wallpaper-script.pid)
# bind = SUPER CTRL, W, exec, pkill waybar -SIGUSR1
# bind = SUPER, P, pseudo, # dwindle
bindd = SUPER, J, Rotate Split, togglesplit, # dwindle


# Screenshots
# bind = SUPER SHIFT, S, exec, grim - | wl-copy
# bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bindd = SUPER SHIFT, S, Screenshot, exec, hyprshot -m output -o ~/Pictures/Screenshots # Screen
bindd = SUPER SHIFT, A, Screenshot Area, exec, hyprshot -m region -o ~/Pictures/Screenshots # Area
bindd = SUPER SHIFT, W, Screenshot Window, exec, hyprshot -m window -o ~/Pictures/Screenshots # Window

# Move focus with mainMod + arrow keys
bindd = SUPER, left, Focus Left, movefocus, l
bindd = SUPER, right, Focus Right, movefocus, r
bindd = SUPER, up, Focus Up, movefocus, u
bindd = SUPER, down, Focus Down, movefocus, d

# Move windows with mainMod + Shift + arrow keys
bindd = SUPER SHIFT, left, Swap Window Left, swapwindow, l
bindd = SUPER SHIFT, right, Swap Window Right, swapwindow, r
bindd = SUPER SHIFT, up, Swap Window Up, swapwindow, u
bindd = SUPER SHIFT, down, Swap Window Down, swapwindow, d

# bind = SUPER CTRL, T, pin, 1

# Switch workspaces with mainMod + [0-9]
bindd = SUPER, 1, Workspace 1, focusworkspaceoncurrentmonitor, 1
bindd = SUPER, 2, Workspace 2, focusworkspaceoncurrentmonitor, 2
bindd = SUPER, 3, Workspace 3, focusworkspaceoncurrentmonitor, 3
bindd = SUPER, 4, Workspace 4, focusworkspaceoncurrentmonitor, 4
bindd = SUPER, 5, Workspace 5, focusworkspaceoncurrentmonitor, 5
bindd = SUPER, 6, Workspace 6, focusworkspaceoncurrentmonitor, 6
bindd = SUPER, 7, Workspace 7, focusworkspaceoncurrentmonitor, 7
bindd = SUPER, 8, Workspace 8, focusworkspaceoncurrentmonitor, 8
bindd = SUPER, 9, Workspace 9, focusworkspaceoncurrentmonitor, 9
bindd = SUPER, 0, Workspace 10, focusworkspaceoncurrentmonitor, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindd = SUPER SHIFT, 1, Move to Workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move to Workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move to Workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move to Workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move to Workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move to Workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move to Workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move to Workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move to Workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Move to Workspace 10, movetoworkspace, 10

bindd = SUPER CTRL ALT SHIFT, E, Exit Hyprland, exit 
bindd = SUPER CTRL ALT SHIFT, S, Shutdown, exec, alga power off; $systemctl poweroff
bindd = SUPER CTRL ALT SHIFT, R, Restart, exec, $systemctl reboot

# Scroll through existing workspaces with mainMod + scroll
# bind = SUPER, mouse_down, workspace, e+1
# bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = SUPER, mouse:272, Move Window, movewindow
bindmd = SUPER, mouse:273, Resize Window, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindeld = ,XF86AudioRaiseVolume, Hidden, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = ,XF86AudioLowerVolume, Hidden, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindeld = ,XF86AudioMute, Hidden, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindld = , XF86AudioNext, Hidden, exec, playerctl next
bindld = , XF86AudioPause, Hidden, exec, playerctl play-pause
bindld = , XF86AudioPlay, Hidden, exec, playerctl play-pause
bindld = , XF86AudioPrev, Hidden, exec, playerctl previous


### WINDOWS AND WORKSPACES ###
windowrule = match:class .*, suppress_event maximize # Ignore maximize requests from apps. You'll probably like this.
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false # Fix some dragging issues with XWayland

### Hack for screen sharing

windowrule = opacity 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = no_anim on, match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus on, match:class ^(xwaylandvideobridge)$
windowrule = max_size 1 1, match:class ^(xwaylandvideobridge)$
windowrule = no_blur on, match:class ^(xwaylandvideobridge)$
windowrule = no_focus on, match:class ^(xwaylandvideobridge)$

### wl-kbptr
bindd=SUPER,H,Hop,exec,wl-kbptr -c ~/.home-manager/config_files/wl-kbptr/config 
bindd = SUPER SHIFT, H, Show/Hide Help, exec, ~/.config/hypr/scripts/which-key.sh -b
submap = reset
