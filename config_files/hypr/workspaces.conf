source = $HOME/.config/hypr/variables.conf

### TERMINAL

bind = $SUPER, T, togglespecialworkspace, terminal 
workspace = special:terminal, on-created-empty:$terminal
# windowrulev2 = bordersize 0, onworkspace: special:terminal
# windowrulev2 = size 1920 2160, onworkspace: special:terminal
# windowrulev2 = float, onworkspace: special:terminal
# windowrulev2 = center, onworkspace: special:terminal

### BROWSER

bind = $SUPER, C, togglespecialworkspace, browser 
workspace = special:browser, on-created-empty:$browser 
windowrulev2 = bordersize 0, onworkspace: special:browser

### CALENDAR

bind = $SUPER SHIFT, C, togglespecialworkspace, calendar 
workspace = special:calendar, on-created-empty:$calendar
windowrulev2 = bordersize 0, onworkspace: special:calendar

### GPT

bind = $SUPER, G, togglespecialworkspace, gpt 
workspace = special:gpt, on-created-empty:$gpt
windowrulev2 = bordersize 0, onworkspace: special:gpt

### SLACK
  
bind = $SUPER, S, togglespecialworkspace, slack 
workspace = special:slack, on-created-empty:$slack  
windowrulev2 = bordersize 0, onworkspace: special:slack 

### DISCORD
  
bind = $SUPER, D, togglespecialworkspace, discord 
