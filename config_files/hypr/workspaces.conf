workspace = special:solidworks, on-created-empty:$solidworks  
windowrulev2 = bordersize 0, onworkspace: special:solidworks 

### Email

bind = $SUPER, E, togglespecialworkspace, email 
workspace = special:email, on-created-empty:$email  
windowrulev2 = bordersize 0, onworkspace: special:email 

### WHATSAPP

bind = $SUPER, W, togglespecialworkspace, whatsapp 
workspace = special:whatsapp, on-created-empty:$whatsapp
windowrulev2 = bordersize 0, onworkspace: special:whatsapp

### EXCEL

bind = $SUPER, X, togglespecialworkspace, excel 
workspace = special:excel, on-created-empty:$excel
windowrulev2 = bordersize 0, onworkspace: special:excel

### LOG

bind = SUPER, L, togglespecialworkspace, log 
workspace = special:log, on-created-empty:$terminal -e sh -lc 'hyprlog; echo; read -p "Press Enter to close..."'
