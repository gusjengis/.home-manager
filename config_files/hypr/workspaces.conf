source = $HOME/.config/hypr/variables.conf
source = $HOME/.config/hypr/platform-variables.conf

### TERMINAL

bindd = $SUPER, T, Terminal, togglespecialworkspace, terminal 
workspace = special:terminal, on-created-empty:$terminal
# windowrule = bordersize 0, onworkspace: special:terminal
# windowrule = size 1920 2160, onworkspace: special:terminal
# windowrule = float, onworkspace: special:terminal
# windowrule = center, onworkspace: special:terminal
### TODOS
bindd = $SUPER SHIFT, T, Todos, togglespecialworkspace, todos 
workspace = special:todos, on-created-empty:$todos
### BROWSER

bindd = $SUPER, C, Chromium, togglespecialworkspace, browser 
workspace = special:browser, on-created-empty:$browser 
windowrule = match:workspace special:browser, border_size 0

### CALENDAR

bindd = $SUPER SHIFT, C, Calendar, togglespecialworkspace, calendar 
workspace = special:calendar, on-created-empty:$calendar
windowrule = match:workspace special:calendar, border_size 0

### GPT

bindd = $SUPER, G, ChatGPT, togglespecialworkspace, gpt 
workspace = special:gpt, on-created-empty:$gpt
windowrule = match:workspace special:gpt, border_size 0

### SLACK
  
bindd = $SUPER, S, Slack, togglespecialworkspace, slack 
workspace = special:slack, on-created-empty:$slack  
windowrule = match:workspace special:slack, border_size 0

### DISCORD
  
bindd = $SUPER, D, Discord, togglespecialworkspace, discord 
workspace = special:discord, on-created-empty:$discord
windowrule = match:workspace special:discord, border_size 0

### OneNote
  
bindd = $SUPER, O, OneNote, togglespecialworkspace, onedrive 
workspace = special:onedrive, on-created-empty:$onedrive  
windowrule = match:workspace special:onedrive, border_size 0

### Plastic
  
bindd = $SUPER, P, Plastic, togglespecialworkspace, plastic 
workspace = special:plastic, on-created-empty:plasticgui  
windowrule = match:workspace special:plastic, border_size 0

### NOTES

bindd = $SUPER, N, Notes, togglespecialworkspace, notes  
workspace = special:notes , on-created-empty:obsidian
windowrule = match:workspace special:notes, border_size 0

### MUSIC

bindd = $SUPER, M, Music, togglespecialworkspace, music 
workspace = special:music, on-created-empty:$music
windowrule = match:workspace special:music, border_size 0

### Solidworks
  
bindd = $SUPER, R, Solidworks, togglespecialworkspace, solidworks 
workspace = special:solidworks, on-created-empty:$solidworks  
windowrule = match:workspace special:solidworks, border_size 0

### Email

bindd = $SUPER, E, Email, togglespecialworkspace, email 
workspace = special:email, on-created-empty:$email  
windowrule = match:workspace special:email, border_size 0

### WHATSAPP

bindd = $SUPER, W, Whatsapp, togglespecialworkspace, whatsapp 
workspace = special:whatsapp, on-created-empty:$whatsapp
windowrule = match:workspace special:whatsapp, border_size 0

### EXCEL

bindd = $SUPER, X, Excel, togglespecialworkspace, excel 
workspace = special:excel, on-created-empty:$excel
windowrule = match:workspace special:excel, border_size 0

### LOG

bindd = SUPER, L, Hyprlog, togglespecialworkspace, log 
workspace = special:log, on-created-empty:$terminal -e sh -lc 'hyprlog; echo; read -p "Press Enter to close..."'

bindd = SUPER SHIFT, P, Power, togglespecialworkspace, status 
workspace = special:status, on-created-empty:$terminal --title "System Status" --class system-status --override font_size=40 -e ~/.home-manager/config_files/hypr/scripts/system-status.sh

bindd = SUPER SHIFT, H, Home Assistant, togglespecialworkspace, home 
workspace = special:home, on-created-empty:$homeAssistant

